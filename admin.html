<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nevertpuzo — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06060a; --card:rgba(20,20,32,.72); --border:rgba(120,90,220,.28);
    --text:#f2f5ff; --muted:#9aa0c0; --cyan:#22d3ee; --violet:#a855f7; --pink:#ec4899;
    --grad:linear-gradient(90deg,#22d3ee,#a855f7,#ec4899); --danger:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Inter",Arial,sans-serif}
  body{
    min-height:100vh;color:var(--text);padding:26px;
    background:
      radial-gradient(700px 500px at 12% -5%,rgba(34,211,238,.16),transparent 60%),
      radial-gradient(760px 560px at 88% 8%,rgba(168,85,247,.18),transparent 62%),
      radial-gradient(700px 620px at 50% 110%,rgba(236,72,153,.14),transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-1px}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h2{font-size:18px;margin-bottom:14px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  input,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:#0f0f18;color:var(--text);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.2)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:130px}
  button{cursor:pointer;border:none;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;background:var(--grad);background-size:200% auto;box-shadow:0 0 20px rgba(168,85,247,.4);transition:.25s}
  button:hover{background-position:right center;box-shadow:0 0 30px rgba(236,72,153,.55)}
  button.ghost{background:transparent;border:1px solid var(--border);box-shadow:none;color:var(--text);font-weight:500}
  button.ghost:hover{background:rgba(120,90,220,.12)}
  button.mini{padding:5px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  code{font-family:"Courier New",monospace;color:var(--cyan)}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px}
  .pill.free{background:rgba(34,197,94,.15);color:var(--ok);border:1px solid rgba(34,197,94,.35)}
  .pill.used{background:rgba(160,160,160,.12);color:var(--muted)}
  .status{font-size:13px;margin-top:10px;min-height:18px}
  .hidden{display:none}
  .login-box{max-width:420px;margin:60px auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>nevert<span>puzo</span> · admin</h1>
  <div class="sub">Управление ключами активации и пользователями</div>

  <!-- Экран входа -->
  <div id="loginScreen" class="card login-box">
    <h2>Вход в админку</h2>
    <label>Секретный ключ администратора</label>
    <input type="password" id="adminSecret" placeholder="ADMIN_SECRET" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:14px"><button onclick="doLogin()" style="width:100%">Войти</button></div>
    <div id="loginStatus" class="status" style="color:var(--danger)"></div>
  </div>

  <!-- Панель -->
  <div id="panel" class="hidden">
    <!-- Ключи -->
    <div class="card">
      <h2>🔑 Ключи активации</h2>
      <div class="row">
        <div>
          <label>Тип ключа</label>
          <select id="keyType">
            <option value="7">7 дней</option>
            <option value="30" selected>30 дней</option>
            <option value="forever">Навсегда</option>
          </select>
        </div>
        <div style="flex:0 0 120px">
          <label>Количество</label>
          <input type="number" id="keyCount" value="1" min="1" max="50">
        </div>
        <div style="flex:0 0 auto">
          <button onclick="createKeys()">Создать ключи</button>
        </div>
        <div style="flex:0 0 auto">
          <button class="ghost" onclick="loadAll()">Обновить</button>
        </div>
      </div>
      <div id="keysStatus" class="status"></div>
      <table>
        <thead><tr><th>Код</th><th>Тип</th><th>Статус</th><th>Создан</th><th></th></tr></thead>
        <tbody id="keysList"></tbody>
      </table>
    </div>

    <!-- Пользователи -->
    <div class="card">
      <h2>👤 Пользователи</h2>
      <div id="usersStatus" class="status"></div>
      <table>
        <thead><tr><th>Email</th><th>Имя</th><th>Тариф</th><th>Создан</th></tr></thead>
        <tbody id="usersList"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_BASE = new URLSearchParams(location.search).get("api") || "";
  let SECRET = sessionStorage.getItem("np_admin_secret") || null;

  const $ = (id) => document.getElementById(id);

  async function adminApi(path, opts){
    opts = opts || {};
    const headers = Object.assign(
      { "Content-Type":"application/json", "x-admin-secret": SECRET || "" },
      opts.headers || {}
    );
    const res = await fetch(API_BASE + path, {
      method: opts.method || "GET",
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = null; try { data = await res.json(); } catch(e){}
    if(!res.ok){ const e = new Error((data&&data.error)||("HTTP "+res.status)); e.status=res.status; throw e; }
    return data;
  }

  function fmtDate(iso){ try { return new Date(iso).toLocaleString("ru-RU"); } catch(e){ return iso||"—"; } }

  async function doLogin(){
    const s = $("adminSecret").value.trim();
    if(!s){ $("loginStatus").textContent="Введите секрет"; return; }
    SECRET = s;
    $("loginStatus").textContent="Проверка...";
    try{
      await adminApi("/api/admin/users"); // проверка секрета
      sessionStorage.setItem("np_admin_secret", SECRET);
      $("loginScreen").classList.add("hidden");
      $("panel").classList.remove("hidden");
      await loadAll();
    }catch(e){
      SECRET=null;
      $("loginStatus").textContent = e.status===403 ? "Неверный секрет" : ("Ошибка: "+e.message);
    }
  }

  function logoutAdmin(){
    SECRET=null; sessionStorage.removeItem("np_admin_secret");
    $("panel").classList.add("hidden"); $("loginScreen").classList.remove("hidden");
  }

  async function createKeys(){
    const type = $("keyType").value;
    const count = parseInt($("keyCount").value,10) || 1;
    $("keysStatus").textContent="Создание...";
    $("keysStatus").style.color="var(--muted)";
    try{
      const d = await adminApi("/api/admin/keys", { method:"POST", body:{ type, count } });
      $("keysStatus").textContent = "Создано ключей: " + d.created.length;
      $("keysStatus").style.color="var(--ok)";
      await loadKeys();
    }catch(e){
      $("keysStatus").textContent = e.status===403 ? "Нет доступа" : ("Ошибка: "+e.message);
      $("keysStatus").style.color="var(--danger)";
      if(e.status===403) logoutAdmin();
    }
  }

  async function loadKeys(){
    try{
      const d = await adminApi("/api/admin/keys");
      const tb = $("keysList"); tb.innerHTML="";
      (d.keys||[]).forEach(k=>{
        const tr = document.createElement("tr");
        const used = !!k.usedBy;
        tr.innerHTML =
          `<td><code>${k.code}</code></td>`+
          `<td>${k.label||k.type}</td>`+
          `<td><span class="pill ${used?"used":"free"}">${used?("Использован · "+k.usedBy):"Свободен"}</span></td>`+
          `<td>${fmtDate(k.createdAt)}</td>`+
          `<td>${used?"":'<button class="ghost mini" onclick="copyCode(\''+k.code+'\')">копировать</button>'}</td>`;
        tb.appendChild(tr);
      });
      if(!(d.keys||[]).length) tb.innerHTML='<tr><td colspan="5" style="color:var(--muted)">Ключей пока нет.</td></tr>';
    }catch(e){ $("keysStatus").textContent="Ошибка загрузки ключей: "+e.message; $("keysStatus").style.color="var(--danger)"; if(e.status===403) logoutAdmin(); }
  }

  async function loadUsers(){
    try{
      const d = await adminApi("/api/admin/users");
      const tb = $("usersList"); tb.innerHTML="";
      (d.users||[]).forEach(u=>{
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${u.email}</td>`+
          `<td>${u.name||"—"}</td>`+
          `<td>${u.plan||"—"}</td>`+
          `<td>${fmtDate(u.createdAt)}</td>`;
        tb.appendChild(tr);
      });
      if(!(d.users||[]).length) tb.innerHTML='<tr><td colspan="4" style="color:var(--muted)">Пользователей пока нет.</td></tr>';
    }catch(e){ $("usersStatus").textContent="Ошибка загрузки пользователей: "+e.message; $("usersStatus").style.color="var(--danger)"; if(e.status===403) logoutAdmin(); }
  }

  async function loadAll(){ await Promise.all([loadKeys(), loadUsers()]); }

  function copyCode(code){
    navigator.clipboard.writeText(code).then(()=>{
      $("keysStatus").textContent="Скопировано: "+code;
      $("keysStatus").style.color="var(--ok)";
    });
  }

  // Автовход, если секрет уже в сессии
  if(SECRET){ doLogin(); }
</script>
</body>
</html>
